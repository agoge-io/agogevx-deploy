apiVersion: v2
name: agogevx
description: >-
  AGOGE VX — Go REST API + React SPA vulnerability-intelligence platform.
  Kubernetes deployment of the same 11 GHCR images published for Docker
  Compose (db, pgbouncer, api, matcher-worker, ingestion-worker,
  report-worker, maintenance-worker, bte-recompute-worker,
  audit-forward-worker, mcp-server, frontend).
type: application

# Chart version — bump on chart changes (independent of the app image tag).
# 0.8.4 — the database password leaves every database URL: agogevx.dbEnv sets
# PGPASSWORD from the Secret key POSTGRES_PASSWORD, and DATABASE_URL and
# DIRECT_DATABASE_URL hold no password, so a password with `/ ? # % "` or a
# space works. See plans/finished/bugs/tracker/2026-11-15-bugs-tracker-22_deploy_and_secret_hygiene.md (design 1).
# 0.8.3 — the api startup probe allows 204 × 5 s = 1,020 s (was 150 s) and the
# api Deployment sets progressDeadlineSeconds: 1200 (was the 600 s default), so
# a boot that runs long migrations (up to 960 s) is not killed or marked failed.
# See plans/finished/bugs/tracker/2026-11-15-bugs-tracker-21_release_and_gate_integrity.md (design 2).
# 0.8.2 — the ingestion-worker gets AGOGEVX_VERSION (= image.version), so the
# feeds' User-Agent names the release, and its /tmp emptyDir gets a size limit
# (ingestion.tmpSizeLimit, 8Gi) for the OSV dumps that now go to disk. See
# plans/finished/matcher/2026-11-15-bugs-tracker-15_lost_and_late_work.md (D12).
# 0.8.1 — every PVC and the chart's agogevx-postgres Secret carry
# helm.sh/resource-policy: keep, so a mode or blob-kind switch and helm uninstall
# keep the disks and the password. See plans/finished/platform/runtime/2026-11-14-platform-runtime-small_tracker_fixes.md (Part 1).
# 0.8.0 — every service except db defaults to 3 replicas (maintenance-worker and
# mcp-server join the HA floor); the compose mode still pins api and frontend to
# 1. See plans/finished/deploy/k8s/2026-10-22-deploy-k8s-replica_floor_every_service.md.
# 0.7.0 — the maintenance-worker gets AGOGEVX_VERSION and, when
# api.appSecretsSecret is set, the four identity secrets of that Secret, so the
# full backups it makes record their release and carry their secrets. See
# plans/finished/platform/backup/2026-10-19-platform-backup-full_archive_offline_restore.md (D18).
# 0.6.0 — enterprise egress proxy (enclave): optional `egress` block injects the
# Kyverno Envoy-sidecar label/annotation + HTTP(S)_PROXY/NO_PROXY env onto the
# egressing workloads (api/ingestion/report/maintenance); render-guarded to
# deployMode: ingress. See plans/finished/deploy/infra/2026-07-07-deploy-infra-enterprise_egress_proxy_support.md.
# 0.5.0 — give api + maintenance-worker their own resources block (base+burst:
# api req 1Gi, maintenance req 512Mi, both limit 3Gi) via the componentResources
# helper, so they reserve a real memory floor instead of the 128Mi global default.
# 0.4.0 — inject AGOGEVX_GHCR_ORG (= image.org) into the api deployment so the
# opt-in Software Updates check pre-fills the org it queries on GHCR.
# 0.3.0 — inject AGOGEVX_VERSION (= image.version) into the api deployment so the
# System console reports the deployed release tag.
# 0.2.0 — added the loadbalancer deployMode (Service type=LoadBalancer + frontend
# Caddy self-ACME) and made postgres-data storageClass default to the cluster's.
# Since 2026-06-16 (ha-floor-no-spof) the api gets that certificate over HTTP-01
# and publishes it to the frontend-tls Secret; Caddy only serves it.
version: 0.8.4

# Default application image tag. The real tag deployed is image.version in
# values.yaml; keep this in sync for `helm show chart` readers.
appVersion: "3.15"

home: https://github.com/agoge-io/agogevx
sources:
  - https://github.com/agoge-io/agogevx
maintainers:
  - name: AGOGE VX
keywords:
  - vulnerability-management
  - cve
  - security
