apiVersion: v2
name: agogevx
description: >-
  AGOGE VX — Go REST API + React SPA vulnerability-intelligence platform.
  Kubernetes deployment of the same nine GHCR images published for Docker
  Compose (db, pgbouncer, api, matcher-worker, ingestion-worker,
  report-worker, bte-recompute-worker, audit-forward-worker, frontend).
type: application

# Chart version — bump on chart changes (independent of the app image tag).
# 0.7.0 — the maintenance-worker gets AGOGEVX_VERSION and, when
# api.appSecretsSecret is set, the four identity secrets of that Secret, so the
# full backups it makes record their release and carry their secrets. See
# plans/finished/platform/backup/2026-10-19-platform-backup-full_archive_offline_restore.md (D18).
# 0.6.0 — enterprise egress proxy (enclave): optional `egress` block injects the
# Kyverno Envoy-sidecar label/annotation + HTTP(S)_PROXY/NO_PROXY env onto the
# egressing workloads (api/ingestion/report/maintenance); render-guarded to
# deployMode: ingress. See plans/finished/deploy/infra/2026-07-07-deploy-infra-enterprise_egress_proxy_support.md.
# 0.5.0 — give api + maintenance-worker their own resources block (base+burst:
# api req 1Gi, maintenance req 512Mi, both limit 3Gi) via the componentResources
# helper, so they reserve a real memory floor instead of the 128Mi global default.
# 0.4.0 — inject AGOGEVX_GHCR_ORG (= image.org) into the api deployment so the
# opt-in Software Updates check pre-fills the org it queries on GHCR.
# 0.3.0 — inject AGOGEVX_VERSION (= image.version) into the api deployment so the
# System console reports the deployed release tag.
# 0.2.0 — added the loadbalancer deployMode (Service type=LoadBalancer + frontend
# Caddy self-ACME) and made postgres-data storageClass default to the cluster's.
version: 0.7.0

# Default application image tag. The real tag deployed is image.version in
# values.yaml; keep this in sync for `helm show chart` readers.
appVersion: "3.7"

home: https://github.com/agoge-io/agogevx
sources:
  - https://github.com/agoge-io/agogevx
maintainers:
  - name: AGOGE VX
keywords:
  - vulnerability-management
  - cve
  - security
