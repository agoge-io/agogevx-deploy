{{- /*
LB-HA TLS RBAC (ha-floor-no-spof Phase 2). Rendered ONLY in loadbalancer mode,
where the api obtains the Let's Encrypt cert (HTTP-01) and must write it back into
the frontend's kubernetes.io/tls Secret + roll the frontend Deployment so its pods
pick up the new cert. Least-privilege: the Role is pinned by resourceNames to the
ONE cert Secret (get/update/patch) and the ONE frontend Deployment (patch) — no
cluster-wide or wildcard rules. The api's SA token is mounted only in this mode
(see api-deployment.yaml automountServiceAccountToken).
*/ -}}
{{- if (include "agogevx.isLoadBalancer" .) }}
{{- $secretName := .Values.frontend.tlsSecret | default "agogevx-frontend-tls" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agogevx-api-tls
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["frontend"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agogevx-api-tls
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
subjects:
  - kind: ServiceAccount
    name: agogevx
roleRef:
  kind: Role
  name: agogevx-api-tls
  apiGroup: rbac.authorization.k8s.io
{{- end }}
