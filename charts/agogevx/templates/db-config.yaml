{{- /* External DB: the in-cluster Postgres config is not deployed. */ -}}
{{- if not .Values.postgres.external.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
data:
  # Mirrors docker/postgres/postgresql.conf with the include path updated to
  # match PGDATA=/var/lib/postgresql/data/pgdata (the K8s subdirectory layout
  # that avoids the lost+found block-device error on fresh PVCs). The reasons
  # for each value are in that file. TestChartDBConfigMirrorsComposeConf
  # (go/internal/vxtool/deploy) fails when the two differ, apart from the
  # include path, listen_addresses and max_connections.
  #
  # A change here rolls the db pod: db-statefulset.yaml carries a checksum of
  # this file. Without it a helm upgrade changed the ConfigMap and Postgres
  # kept the old settings, because the file is mounted by subPath.
  postgresql.conf: |
    include = '/var/lib/postgresql/data/pgdata/postgresql.conf'

    listen_addresses = '*'

    shared_preload_libraries = 'pg_stat_statements,auto_explain'
    pg_stat_statements.max = 10000
    pg_stat_statements.track = top
    pg_stat_statements.track_planning = on

    # Diagnostics (plan 01 Part 2).
    track_io_timing = on
    track_activity_query_size = 16384
    log_min_duration_statement = 5s
    log_temp_files = 10MB
    auto_explain.log_min_duration = 30s
    auto_explain.log_analyze = off
    auto_explain.log_format = json

    # WAL, checkpoints and autovacuum (plan 01 Part 3, the low-risk budgets).
    # pg_wal can grow to about max_wal_size: keep that much free on the PVC.
    max_wal_size = 8GB
    checkpoint_timeout = 15min
    wal_compression = lz4
    autovacuum_max_workers = 4
    autovacuum_vacuum_cost_limit = 1000

    # Sized for the HA-floor pgbouncer budget (ha-floor-no-spof). When
    # db.route=pgbouncer (l/xl tiers) the 3 poolers front the whole stack:
    # 3 × defaultPoolSize(100) = 300 steady upstream conns, + reserve_pool_size
    # burst (3×5) + ingestion's direct CONCURRENTLY/advisory-lock conns that bypass
    # pgbouncer + superuser_reserved ≈ 320-330 worst case. 350 leaves ~20-25 headroom.
    # Keep this ≥ pgbouncer.replicas × defaultPoolSize + ~30; an external/managed DB
    # must offer at least the same (the floor's smallest validated managed DB is 397).
    max_connections = 350
    random_page_cost = 1.1
    effective_io_concurrency = 200
    maintenance_work_mem = 1GB
    work_mem = 16MB
    shared_buffers = 512MB
    statement_timeout = 30s
    idle_in_transaction_session_timeout = 120s
{{- end }}
