{{- /*
Seeded frontend TLS Secret (ha-floor-no-spof Phase 2). Rendered ONLY in
loadbalancer mode. On first install it holds a self-signed cert so the frontend
Caddy pods always have something to serve (no CrashLoop) before the api obtains +
publishes the real Let's Encrypt cert and rolls the frontend.

Idempotent: on a `helm upgrade` we `lookup` the existing Secret and re-emit its
data verbatim, so we NEVER clobber the real cert the api has already published.
(During `helm template` / first install `lookup` returns nothing, so the
self-signed seed is rendered — exactly what a fresh install needs.)
*/ -}}
{{- if (include "agogevx.isLoadBalancer" .) }}
{{- $name := .Values.frontend.tlsSecret | default "agogevx-frontend-tls" }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
type: kubernetes.io/tls
data:
{{- if and $existing $existing.data (index $existing.data "tls.crt") }}
  # Preserve the cert already in the cluster (seeded earlier, or the real cert the
  # api published) — an upgrade must never reset the front door to self-signed.
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
  # First install: a self-signed seed so Caddy can serve TLS immediately. The api
  # overwrites this with the real Let's Encrypt cert once issuance completes.
  {{- $dn := .Values.domain | default "localhost" }}
  {{- $seed := genSelfSignedCert $dn (list) (list $dn) 3650 }}
  tls.crt: {{ $seed.Cert | b64enc }}
  tls.key: {{ $seed.Key | b64enc }}
{{- end }}
{{- end }}
