apiVersion: v1
kind: Service
metadata:
  # MUST be "api": Caddy reverse-proxies /api/* and /health* to `api:5000`.
  name: api
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agogevx
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 5000
      targetPort: 5000
