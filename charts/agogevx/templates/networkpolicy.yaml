{{- if .Values.networkPolicy.enabled }}
{{- /*
Network segmentation (security review #2). Default-deny INGRESS for the whole
namespace, then allow only the paths the app needs:
  - public/LB -> frontend on 80/443 (+ api -> frontend:2019 admin under compose)
  - frontend  -> api on 5000
  - any agogevx pod -> in-cluster db (5432) / pgbouncer (6432), when rendered
Workers expose no ports, so default-deny fully covers them.

Egress is intentionally NOT denied: ingestion-worker pulls external CVE feeds,
api/frontend reach Let's Encrypt + GHCR, and the app dials the managed
(off-cluster) DB. A default-deny egress needs a per-destination allowlist
(external DB IP, ACME, feed endpoints) — tracked as a follow-up.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agogevx
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    # Public entry: the LoadBalancer / ingress forwards 80/443 to the SPA.
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
{{- if (include "agogevx.isCompose" .) }}
    # Compose mode only: the api hot-pushes Caddy config to the admin API.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agogevx
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 2019
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agogevx
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    # Only the frontend (Caddy) proxies user/agent traffic to the api.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agogevx
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 5000
{{- if eq .Values.db.route "pgbouncer" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer-ingress
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agogevx
      app.kubernetes.io/component: pgbouncer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agogevx
      ports:
        - protocol: TCP
          port: 6432
{{- end }}
{{- if not .Values.postgres.external.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-ingress
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agogevx
      app.kubernetes.io/component: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agogevx
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- end }}
