{{- /*
Chart-managed Postgres password Secret.

Rendered only when postgres.password is set AND postgres.existingSecret is not.
If neither is provided the install will fail at runtime (db + api can't auth) —
supply one at install time:
    --set postgres.password=$(openssl rand -base64 32)
  or
    --set postgres.existingSecret=<name-of-secret-with-POSTGRES_PASSWORD>
*/ -}}
{{- if and (not .Values.postgres.existingSecret) .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: agogevx-postgres
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}
