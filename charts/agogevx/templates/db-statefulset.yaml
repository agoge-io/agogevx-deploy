{{- /* External DB: the in-cluster Postgres is not deployed. */ -}}
{{- if not .Values.postgres.external.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    {{- include "agogevx.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agogevx
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        {{- include "agogevx.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: db
    spec:
      serviceAccountName: agogevx
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # NOTE: db intentionally has NO pod securityContext / fsGroup. The
      # agogevx-postgres image starts as root so its entrypoint-wrapper can
      # chown /var/lib/postgresql/data to 70:70 and chmod 0700 (Postgres
      # rejects group-accessible data dirs, so fsGroup would BREAK it), then
      # drops to UID 70 via su-exec. The serving postgres process is non-root.
      containers:
        - name: db
          image: {{ include "agogevx.image" (list . .Values.image.names.postgres) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Passed through the entrypoint wrapper to postgres (compose `command`).
          args:
            - "-c"
            - "config_file=/etc/postgresql/postgresql.conf"
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agogevx.postgresSecretName" . }}
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: {{ .Values.postgres.memLimit }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.postgres.shmSize }}
        - name: postgres-config
          configMap:
            name: postgres-config
{{- end }}
