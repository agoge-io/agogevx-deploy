# =============================================================================
# AGOGE VX — PRODUCTION tier: up to 25,000 agents
# =============================================================================
# A self-contained production overlay. Apply it as the ONLY -f file — it already
# carries the multi-node HA settings (you do NOT also need values-multinode.yaml).
#
# Cluster sizing (production sizing matrix)
#   Kubernetes nodes ........ 3 × (min 4 vCPU / 16 GB RAM)
#   Dedicated Postgres ...... 4 vCPU / 16 GB / NVMe   (EXTERNAL — not in-cluster)
#   Steady-state load ....... ~0.3–1.2 req/s (25k agents, 6–24 h check-in cadence)
#
# Component replicas (HA floor 3 everywhere; matcher is the throughput knob)
#   matcher-worker .......... 3        pgbouncer ............... 3
#   api ..................... 3        frontend ................ 3
#   ingestion-worker ........ 3        report-worker ........... 3
#   maintenance-worker ...... 3        bte-recompute-worker .... 3
#   audit-forward-worker .... 3
#
# Connection budget (db.route=pgbouncer → every app pool dials the 3 in-cluster
# poolers, which front the dedicated Postgres). Size the DB's max_connections:
#   through-pgbouncer client demand ...... 129
#       api 3×10=30  bte 3×8=24  ingestion 3×5=15  maintenance 3×4=12
#       report 3×4=12  audit 3×4=12  matcher 3×8=24
#   relay cap (3 × defaultPoolSize 60) .... 180   (1.4× demand — headroom)
#   matcher cache pool (DIRECT, 3×2) ......   6   (bypasses pgbouncer, hits DB direct)
#   → set the dedicated Postgres  max_connections ≥ 250
#
# Install (loadbalancer profile — cloud LB + frontend Caddy self-ACME; no
# nginx-ingress, no cert-manager):
#   1. Provision the dedicated Postgres, then create its two Secrets:
#        kubectl -n agogevx create secret generic agogevx-db-ca --from-file=ca.crt=./db-ca.crt
#        kubectl -n agogevx create secret generic agogevx-postgres \
#          --from-literal=POSTGRES_PASSWORD=<app-db-password>
#      (vxctl also mints agogevx-secrets for the api crypto material.)
#   2. Set postgres.external.host below to the DB's FQDN (never an IP — TLS SAN).
#   3. Configure object storage (System → Storage → private S3 bucket) on first
#      boot BEFORE scaling traffic — blobVolumeKind=emptyDir keeps no shared volume.
#   4. helm upgrade --install agogevx ./agogevx \
#        -f agogevx/values-prod-25k.yaml --set domain=valex.example.com \
#        -n agogevx --create-namespace
#   5. Point the domain's DNS at the frontend LoadBalancer's external IP.
#
# To run behind an EXISTING nginx-ingress + cert-manager instead, layer
# values-ingress.yaml AFTER this file (it flips deployMode + ingress.enabled).
# =============================================================================

deployMode: loadbalancer

# Real public FQDN (never an IP — IP-SAN self-signed certs break browser TLS).
# Override at install with --set domain=...
domain: valex.example.com

# --- Dedicated (external) Postgres -------------------------------------------
# The in-cluster db StatefulSet / postgres-data PVC / db Service are NOT rendered.
# Both the app pools and the in-cluster PgBouncer dial this DB over TLS.
postgres:
  external:
    enabled: true
    host: ""                  # REQUIRED — the dedicated Postgres FQDN
    port: 5432
    database: vulndb          # may differ on a managed DB (e.g. defaultdb)
    user: vulndb              # may differ (e.g. doadmin)
    sslMode: verify-full
    caCertSecret: agogevx-db-ca # Secret with key ca.crt

# Pool the whole stack through the 3 in-cluster PgBouncers (required past ~10k agents).
db:
  route: pgbouncer

# --- PgBouncer (transaction-mode pool) ---------------------------------------
pgbouncer:
  replicas: 3
  # Relay cap = replicas × defaultPoolSize = 180 upstream slots (1.4× the 129
  # demand). Raise the dedicated Postgres max_connections BEFORE raising this.
  defaultPoolSize: 60

# --- HA floor: 3 replicas of every stateless component -----------------------
api:
  replicas: 3
frontend:
  replicas: 3
  serviceType: LoadBalancer
ingestion:
  replicas: 3
report:
  replicas: 3
maintenance:
  replicas: 3
bte:
  replicas: 3
auditForward:
  replicas: 3

# --- Matcher: the throughput knob (3 at this tier) ---------------------------
# Each pod requests==limits 3Gi (chart default — the memory-heaviest worker).
# With soft topology spread that is ~1 matcher × 3Gi per node — comfortable on
# the 16 GB nodes. (Operators wanting a tainted matcher-only node pool can set
# matcher.nodeSelector / matcher.tolerations — see values.yaml.)
matcher:
  replicas: 3

# --- Storage: blobs in S3, no shared volume (api/report-worker scale freely) --
persistence:
  blobVolumeKind: emptyDir

# --- Multi-node hardening ----------------------------------------------------
pdb:
  enabled: true
  minAvailable: 1
topologySpread:
  enabled: true
# Default-deny ingress + explicit allows; egress stays open (external DB, ACME,
# GHCR). No-op on a CNI that does not enforce NetworkPolicy.
networkPolicy:
  enabled: true
